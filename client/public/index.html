<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>운동 기록</title>
    <meta name="description" content="개인용 운동 기록 앱" />
    <meta name="theme-color" content="#0f0f10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="운동 기록" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/main.css" />
    <script>
      // 저장한 화면 테마를 첫 화면 전에 적용한다 (기본: 어둡게). client/src/theme.ts 와 같은 규칙
      try {
        var t = localStorage.getItem('fitness.theme');
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>이 앱은 JavaScript 가 필요해요.</noscript>
    <script type="module" src="/main.js"></script>
  </body>
</html>
